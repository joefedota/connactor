services:
  neo4j:
    image: neo4j:5-community
    restart: always
    # 7687 is published on all host interfaces — the VPC firewall (allow-neo4j-from-cloudrun,
    # tcp:7687 from 10.0.0.0/8) is what restricts access to Cloud Run only. 7474 (HTTP browser)
    # is intentionally not published; tunnel via SSH for debugging.
    ports:
      - "7687:7687"
    volumes:
      - /data/neo4j/data:/data
      - /data/neo4j/logs:/logs
      - /data/dumps:/dumps
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_initial__size=4g
      - NEO4J_dbms_memory_heap_max__size=4g
      - NEO4J_dbms_memory_pagecache_size=6g
