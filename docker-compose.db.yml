services:
  neo4j:
    image: neo4j:5-community
    restart: always
    # 7687 (Bolt) is published on all host interfaces — the VPC firewall
    # (allow-neo4j-from-cloudrun, tcp:7687 from 10.0.0.0/8) restricts access to Cloud Run.
    # 7474 (HTTP browser) is published on localhost only — reach it via SSH tunnel
    # (see docs/ops/setup-vm.md "Browsing the graph").
    ports:
      - "7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - /data/neo4j/data:/data
      - /data/neo4j/logs:/logs
      - /data/dumps:/dumps
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_initial__size=4g
      - NEO4J_dbms_memory_heap_max__size=4g
      - NEO4J_dbms_memory_pagecache_size=6g
