version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: connactor-neo4j-dev
    ports:
      - "127.0.0.1:7474:7474" # Neo4j Browser HTTP
      - "127.0.0.1:7687:7687" # Neo4j Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/dumps:/dumps
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-connactorpassword}
      - NEO4J_dbms_memory_heap_initial__size=2g
      - NEO4J_dbms_memory_heap_max__size=2g
      - NEO4J_dbms_memory_pagecache_size=2g
    restart: always

  postgres:
    image: postgres:16
    container_name: connactor-postgres-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=connactor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-connactorpassword}
      - POSTGRES_DB=connactor
    restart: always

volumes:
  neo4j_data:
    name: connactor_neo4j_data
  neo4j_logs:
    name: connactor_neo4j_logs
  postgres_data:
    name: connactor_postgres_data
