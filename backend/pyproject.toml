readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "networkx==3.2.1",
    "pydantic==2.7.1",
    "python-dotenv==1.0.1",
    "pytest==8.2.0",
    "httpx==0.27.0",
    "neo4j>=5.0,<6",
    "google-cloud-storage>=2.0",
    "google-cloud-bigquery>=3.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
    "tqdm>=4.0",
    "jsonlines>=4.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "itsdangerous>=2.2",
    "pytest-asyncio>=0.23",
]

