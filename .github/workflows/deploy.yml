name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: connactor-497019
      REGION: us-central1
      IMAGE_REPO: us-central1-docker.pkg.dev/connactor-497019/connactor/api
      SERVICE_NAME: connactor-api
      PIPELINE_JOB: connactor-pipeline-full
      COST_REPORT_JOB: connactor-cost-report
      DAILY_PUZZLE_JOB: connactor-daily-puzzle
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: connactor-api@connactor-497019.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build & push image
        working-directory: backend
        run: |
          docker build \
            -t "$IMAGE_REPO:${{ github.sha }}" \
            -t "$IMAGE_REPO:latest" .
          docker push "$IMAGE_REPO:${{ github.sha }}"
          docker push "$IMAGE_REPO:latest"

      - name: Roll service to new image
        run: |
          gcloud run services update "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_REPO:${{ github.sha }}"

      - name: Roll pipeline job to new image
        run: |
          gcloud run jobs update "$PIPELINE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_REPO:${{ github.sha }}"

      - name: Roll cost-report job to new image
        run: |
          gcloud run jobs update "$COST_REPORT_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_REPO:${{ github.sha }}"

      - name: Roll daily-puzzle job to new image
        run: |
          gcloud run jobs update "$DAILY_PUZZLE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_REPO:${{ github.sha }}"
